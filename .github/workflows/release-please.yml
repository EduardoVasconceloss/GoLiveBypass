name: release-please

# Mantem um PR de release sempre atualizado (versao calculada a partir dos Conventional
# Commits desde a ultima release + CHANGELOG.md gerado). Nada e lancado so por isso -- o
# trigger de verdade e mergear esse PR, que faz esta mesma Action cortar a tag e a GitHub
# Release. Quando isso acontece, o job build-installer abaixo chama build-installer.yml direto
# (workflow_call) na mesma run, pra compilar e anexar os .exe -- um push de tag feito com o
# GITHUB_TOKEN padrao (o que a Action usa pra criar a tag) nao dispara outros workflows via
# "on: push: tags", entao build-installer.yml nunca rodaria sozinho depois do merge.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-installer.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
